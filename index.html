<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora AI — Искусственный интеллект</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="stars"></div>
    <div class="aurora-bg"></div>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🌌</span>
                <span class="logo-text">Aurora AI</span>
            </div>
            <div class="header-right">
                <span class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    Онлайн
                </span>
                <button class="btn-new-chat" id="newChatBtn">➕ Новый чат</button>
            </div>
        </header>

        <!-- Основная область -->
        <main class="main-content">
            <!-- Боковая панель с чатами -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>📋 История</span>
                    <button class="btn-clear-all" id="clearAllBtn">Очистить все</button>
                </div>
                <div class="chat-list" id="chatList">
                    <!-- Чаты будут добавляться сюда -->
                </div>
            </aside>

            <!-- Область чата -->
            <section class="chat-area">
                <div class="chat-header">
                    <span id="currentChatName">Чат #1</span>
                    <span class="chat-status">🟢 активно</span>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <div class="message bot">
                        <div class="message-avatar">🌌</div>
                        <div class="message-content">
                            <div class="message-text">
                                Привет! Я <strong>Aurora AI</strong>!<br />
                                Задавай вопросы, проси нарисовать картинку или показать код! 🚀
                            </div>
                            <div class="message-time">только что</div>
                        </div>
                    </div>
                </div>

                <!-- Поле ввода -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="messageInput"
                            placeholder="Напиши сообщение..."
                            autofocus
                        />
                        <button class="btn-send" id="sendBtn">➤</button>
                    </div>
                    <div class="input-hint">
                        <span>💡</span>
                        <span>
                            <kbd>нарисуй</kbd> кот в космосе &bull;
                            <kbd>код</kbd> телеграм бот
                        </span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
