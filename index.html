<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURORA AI</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">
                <span class="icon">✦</span>
                <h1>AURORA <span>AI</span></h1>
            </div>
            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Подключение...</span>
            </div>
        </header>

        <div id="chatContainer">
            <div id="messages"></div>
            <div id="typingIndicator" class="hidden">
                <span>AURORA печатает</span>
                <span class="dots">...</span>
            </div>
        </div>

        <div id="inputArea">
            <div style="display: flex; gap: 0.6rem; width: 100%;">
                <input type="text" id="userInput" placeholder="Спросите что-нибудь..." autofocus />
                <button id="sendBtn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Контекстное меню -->
    <div id="contextMenu" class="hidden">
        <div class="menu-item" data-action="copy">⎘ Копировать</div>
        <div class="menu-item" data-action="edit">✎ Редактировать</div>
        <div class="menu-item" data-action="delete">✕ Удалить</div>
        <div class="menu-item" data-action="regenerate">⟳ Повторить</div>
        <div class="menu-divider"></div>
        <div class="menu-item" data-action="react1"> ❤️</div>
        <div class="menu-item" data-action="react2"> 🔥</div>
        <div class="menu-item" data-action="react3"> 🚀</div>
        <div class="menu-item" data-action="react4"> 💪</div>
        <div class="menu-item" data-action="react5"> 🌟</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
