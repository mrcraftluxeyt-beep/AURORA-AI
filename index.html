<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURORA — AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           🌌 AURORA — ВСТРОЕННЫЕ СТИЛИ (ГАРАНТИРОВАННО РАБОТАЮТ)
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0d15;
            color: #e8edf5;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #0b0d15;
        }

        /* --- Боковая панель --- */
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100vh;
            background: #0d0f17;
            border-right: 1px solid #1a1f2e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid #1a1f2e;
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #a78bfa;
        }

        .subtitle {
            color: #4a4f62;
            font-size: 12px;
        }

        .btn-new-chat {
            margin: 12px 16px;
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: #4f46e5;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-new-chat:hover {
            background: #4338ca;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .chat-item {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-item:hover {
            background: #141824;
        }

        .chat-item.active {
            background: #1a1f2e;
            border: 1px solid #2a2f42;
        }

        .chat-name {
            font-size: 14px;
            color: #e8edf5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .chat-time {
            font-size: 11px;
            color: #4a4f62;
            margin-left: 8px;
        }

        .chat-delete {
            background: none;
            border: none;
            color: #4a4f62;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }

        .chat-delete:hover {
            color: #f87171;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #1a1f2e;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .sidebar-footer button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #1a1f2e;
            background: transparent;
            color: #8892b0;
            cursor: pointer;
            font-size: 12px;
        }

        .sidebar-footer button:hover {
            background: #141824;
            color: #e8edf5;
        }

        /* --- Чат --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0d15;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid #1a1f2e;
            min-height: 64px;
            gap: 12px;
            flex-shrink: 0;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #e8edf5;
            font-size: 24px;
            cursor: pointer;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-info h2 {
            font-size: 18px;
            font-weight: 600;
            color: #e8edf5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-date {
            font-size: 12px;
            color: #4a4f62;
        }

        .btn-delete-chat {
            background: none;
            border: none;
            color: #4a4f62;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .btn-delete-chat:hover {
            color: #f87171;
        }

        /* --- Сообщения --- */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: #1e2230;
        }

        .message.bot .avatar {
            background: #4f46e5;
        }

        .message.user .avatar {
            background: #2563eb;
        }

        .bubble {
            background: #141824;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid #1a1f2e;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            color: #e8edf5;
        }

        .message.user .bubble {
            background: #1a1f2e;
            border-color: #2a2f42;
        }

        /* --- Ввод --- */
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px 24px 24px;
            border-top: 1px solid #1a1f2e;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid #1a1f2e;
            background: #0d0f17;
            color: #e8edf5;
            font-size: 15px;
            resize: none;
            font-family: inherit;
            max-height: 120px;
            min-height: 50px;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .input-area textarea::placeholder {
            color: #4a4f62;
        }

        .input-area button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #4f46e5;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .input-area button:hover:not(:disabled) {
            background: #4338ca;
        }

        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* --- Модальное окно --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #141824;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid #1a1f2e;
            max-width: 420px;
            width: 100%;
        }

        .modal-content h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e8edf5;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-group label {
            font-size: 13px;
            font-weight: 600;
            color: #c8d0e0;
        }

        .setting-group select,
        .setting-group input[type="text"] {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #1a1f2e;
            background: #0d0f17;
            color: #e8edf5;
            font-size: 14px;
        }

        .setting-group select:focus,
        .setting-group input[type="text"]:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .setting-group input[type="range"] {
            accent-color: #4f46e5;
            width: 100%;
        }

        #tempValue {
            font-weight: 600;
            color: #a78bfa;
        }

        .modal-footer {
            margin-top: 20px;
            text-align: center;
        }

        .btn-close-modal {
            padding: 10px 32px;
            border-radius: 10px;
            border: none;
            background: #4f46e5;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-close-modal:hover {
            background: #4338ca;
        }

        /* --- Адаптив --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 280px;
                transform: translateX(-100%);
                z-index: 50;
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: block;
            }

            .chat-header {
                padding: 12px 16px;
            }

            .messages {
                padding: 16px;
            }

            .message {
                max-width: 92%;
            }

            .input-area {
                padding: 12px 16px 16px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 260px;
            }

            .messages {
                padding: 12px;
            }

            .bubble {
                font-size: 14px;
                padding: 10px 14px;
            }

            .avatar {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Боковая панель -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>🌌 AURORA</h1>
                <p class="subtitle">AI Assistant</p>
            </div>
            <button class="btn-new-chat" id="newChatBtn">➕ Новый чат</button>
            <div class="chat-list" id="chatList"></div>
            <div class="sidebar-footer">
                <button id="settingsBtn">⚙️ Настройки</button>
                <button id="clearAllBtn">🗑️ Удалить все</button>
            </div>
        </aside>

        <!-- Чат -->
        <main class="chat-area">
            <header class="chat-header">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <div class="chat-info">
                    <h2 id="chatTitle">Новый чат</h2>
                    <span class="chat-date" id="chatDate">Сегодня</span>
                </div>
                <button class="btn-delete-chat" id="deleteChatBtn">🗑️</button>
            </header>

            <div class="messages" id="messages">
                <div class="message bot">
                    <div class="avatar">🌌</div>
                    <div class="bubble">
                        <p>Привет! Я AURORA. Создайте новый чат, чтобы начать ✨</p>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="userInput" rows="1" placeholder="Спросите AURORA..."></textarea>
                <button id="sendBtn">➤</button>
            </div>
        </main>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>⚙️ Настройки</h2>
            <div class="modal-body">
                <div class="setting-group">
                    <label>🤖 Модель</label>
                    <select id="modelSelect">
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>🎚️ Температура</label>
                    <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7" />
                    <span id="tempValue">0.7</span>
                </div>
                <div class="setting-group">
                    <label>📡 API URL</label>
                    <input type="text" id="apiUrl" value="https://aurora-api.onrender.com/api/v1/chat" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-close-modal" id="closeSettingsBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
                    </html>
