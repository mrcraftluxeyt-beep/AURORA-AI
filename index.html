<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURORA — AI Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- ===== СТРАНИЦА РЕГИСТРАЦИИ ===== -->
    <div class="auth-page" id="authPage">
        <div class="auth-container">
            <div class="auth-header">
                <h1>🌌 AURORA</h1>
                <p>Войдите, чтобы начать общение</p>
            </div>

            <!-- Кнопка входа через Google -->
            <button class="google-btn" id="googleBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
                Войти через Google
            </button>

            <div class="divider">или</div>

            <!-- Форма email -->
            <form id="emailForm">
                <input type="email" id="emailInput" placeholder="Email" required />
                <button type="submit" id="sendCodeBtn">Отправить код</button>
            </form>

            <!-- Поле для кода -->
            <div id="codeSection" style="display:none;">
                <input type="text" id="codeInput" placeholder="Введите код из email" maxlength="6" />
                <button id="verifyCodeBtn">Подтвердить</button>
            </div>

            <!-- Капча -->
            <div class="captcha-container">
                <div class="captcha-box" id="captchaBox">
                    <span id="captchaText"></span>
                    <button type="button" id="refreshCaptcha">⟳</button>
                </div>
                <input type="text" id="captchaInput" placeholder="Введите код с картинки" maxlength="6" />
            </div>

            <div id="authStatus" class="auth-status"></div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ ЧАТ ===== -->
    <div class="app" id="chatApp" style="display:none;">
        <!-- Боковая панель -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>🌌 AURORA</h1>
                <p class="subtitle">AI Assistant</p>
                <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
            </div>
            <div class="settings">
                <div class="setting-group">
                    <label>🤖 Модель</label>
                    <select id="modelSelect">
                        <option value="gemini-1.5-flash" selected>Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>🎚️ Температура</label>
                    <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7" />
                    <span id="tempValue">0.7</span>
                </div>
                <button class="btn-clear" id="clearChatBtn">🗑️ Очистить чат</button>
                <div class="status" id="status">
                    <span class="dot"></span>
                    <span id="statusText">Готов к работе</span>
                </div>
            </div>
        </aside>

        <!-- Чат -->
        <main class="chat-area">
            <header class="chat-header">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h2>AURORA</h2>
                <span class="model-badge" id="modelBadge">Gemini 1.5 Flash</span>
            </header>

            <div class="messages" id="messages">
                <div class="message bot">
                    <div class="avatar">🌌</div>
                    <div class="bubble">
                        <p>Добро пожаловать, <span id="userName">друг</span>! ✨</p>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="userInput" rows="1" placeholder="Спросите AURORA..."></textarea>
                <button id="sendBtn">➤</button>
            </div>
        </main>
    </div>

    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="app.js"></script>
</body>
</html>
