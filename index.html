<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURORA AI</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="aurora-icon">✦</span>
                <h1>AURORA AI</h1>
            </div>
            <button class="new-chat-btn" id="newChatBtn">
                <span>✧</span> Новый чат
            </button>
            <div class="chat-list" id="chatList">
                <!-- Список чатов будет генерироваться JS -->
            </div>
            <div class="sidebar-footer">
                <div class="status">
                    <span class="status-dot"></span>
                    <span>API: активен</span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="chat-header">
                <div class="header-info">
                    <span class="model-badge">✦ AURORA 1.0</span>
                    <span class="context-info">Контекст: 8K</span>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">⌛</div>
                    <h2>Привет, я AURORA AI</h2>
                    <p>Чем могу помочь тебе сегодня?</p>
                    <div class="suggestions">
                        <button class="suggestion-btn">Напиши код</button>
                        <button class="suggestion-btn">Объясни сложное</button>
                        <button class="suggestion-btn">Придумай идею</button>
                    </div>
                </div>
                <div id="messages"></div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" rows="1" placeholder="Спроси меня о чем угодно..."></textarea>
                    <button id="sendBtn" class="send-btn">
                        <span>➤</span>
                    </button>
                </div>
                <div class="input-footer">
                    <span>AURORA AI может ошибаться</span>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
